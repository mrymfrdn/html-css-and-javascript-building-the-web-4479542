<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Typed poem</title>
<style>
:root {
  --bg: #000000;
  --ink: #ffffff;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { background: var(--bg); }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); overflow: hidden; font-family: Helvetica, Arial, sans-serif; }

#poem {
  position: fixed; left: 6vw; top: 6vh; width: 88vw;
  transition: opacity var(--fade-ms, 1500ms) ease;
}
#final {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  box-sizing: border-box; padding: 0 6vw;
  transition: opacity var(--fade-ms, 1500ms) ease;
}
#poem.out, #final.out { opacity: 0; }

.line { display: block; width: fit-content; min-height: 1.2em;
  font-size: clamp(16px, min(3.6vw, 5.6vh), 50px); line-height: 1.2; white-space: normal; }
.final-line { font-weight: 700; text-align: center; max-width: 100%; }
.start-hint { font-size: clamp(14px, min(2.4vw, 3.6vh), 24px); opacity: 0.5; cursor: pointer; }
.rest { visibility: hidden; }

/* drifting pages: each line wanders slowly, words thicken or fade */
.word { transition: opacity 3s ease, -webkit-text-stroke-width 3s ease;
  -webkit-text-stroke: 0 currentColor; }
.word.bolded { -webkit-text-stroke-width: 0.035em; }

.typing .done::after {
  content: ""; display: inline-block; width: 0.06em; height: 1em;
  margin-left: 0.05em; vertical-align: -0.12em; background: var(--ink);
  animation: blink 0.9s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .typing .done::after { animation: none; } }
</style>
</head>
<body>
<div id="poem"></div>
<div id="final"></div>

<script>
/* ============================================================
   TIMING — change these to taste (all in milliseconds)
============================================================ */
var CHAR_SPEED    = 55;    // time per typed character
var LINE_PAUSE    = 650;   // pause between lines
var STANZA_PAUSE  = 800;   // extra pause before a line marked with a blank-line gap
var FINAL_DELAY   = 5000;  // how long the final line waits before it starts typing
var FADE_MS       = 1500;  // fade-to-black duration (also set as --fade-ms below)
var BLACK_PAUSE   = 700;   // how long the screen holds on plain black before the next page

// Browsers only allow sound after the viewer clicks/taps, so the poem waits
// for one tap first. Set to "" for a plain black start screen.
var START_TEXT    = "";

/* ============================================================
   DRIFT PAGES — only used by pages that have  drift: true
============================================================ */
var DRIFT_X        = 3;     // how far each line wanders sideways (% of screen width)
var DRIFT_Y        = 2;     // how far each line wanders up/down (% of screen height)
var DRIFT_MIN_S    = 7;     // slowest/fastest a single move takes, in seconds
var DRIFT_MAX_S    = 12;
var BOLD_SPREAD    = 8000;  // *marked* words turn bold at random times within this long after typing ends
var FADE_TO        = 0.3;   // how faint a fading word gets (0 = vanishes, 1 = no fade)
var FADE_EVERY_MIN = 3000;  // random gap between one word fading and the next
var FADE_EVERY_MAX = 7000;
var FADE_HOLD      = 5000;  // how long a word stays faded before coming back

/* ============================================================
   PILE PAGES — only used by pages that have  pile: true
============================================================ */
var PILE_BOTTOM    = 8;     // keep this much empty at the bottom (% of screen height)
var PILE_MOVE_S    = 1.5;   // seconds the lines take to slide up for each new line
var PILE_AT_END    = true;  // after the last line, slowly pile EVERY line up at the top
var PILE_END_DELAY = 8000;  // wait this long after the last line before that starts
var PILE_END_S     = 20;    // how many seconds that final pile-up takes

document.documentElement.style.setProperty('--fade-ms', FADE_MS + 'ms');

/* ============================================================
   CONTENT — each page is its own screen, shown one click at a time.
   "lines": [text, indent as % of width, blank lines before]
   "finalLine": optional — a big centered line that appears automatically
                after the page's lines finish, no click needed for it.
   "audio":     optional — a sound file (in the same folder as this page) that
                starts when the page starts and keeps playing through the
                pages after it until the file ends.
   "drift":     optional — true makes the lines wander slowly around the
                page; words wrapped in *stars* slowly turn bold, and a few
                random words fade a little and come back.
   "pile":      optional — true makes the lines slide up as new lines are
                typed at the bottom; lines that reach the top stop there and
                pile up on top of each other.
============================================================ */
var PAGES = [
  {
    lines: [
      ["the sound of a Skype call still haunts you…", 0, 1]
    ],
    audio: "skype-call.mp3",
    finalLine: "Now you can look back at the files"
  },
  {
    lines: [
      ["the images", 32, 0],
      ["the audios…", 43, 0],
      ["you recorded the sessions subconsciously,", 3, 0],
      ["feeling something needs to be kept", 0, 0],
      ["now all of them are evidences", 0, 2],
      ["That I stored for you in my memory…", 0, 0],
      ["Like snapshots from a session,", 0, 1]
    ]
  },
  {
    drift: true,
    pile: true,
    lines: [
      ["You are left alone in the silence of the house. You take a cold shower, to calm down after the session. He told you to.", 12, 0],
      ["You still hear his voice in your head. You don't want to. you can't stop it. ", 43, 0],
      ["you punch the air, he taught you to. Hitting imaginary people.", 3, 0],
      ["You hate this exercise. And all the others. you just want him out of your head. out of your body. makes your skin itch. Covered in rash. ", 0, 0],
      ["", 0, 2],
      ["you watch him fall. you kick him, as he is lying and holding his imaginary stomach. you watch him bleed ", 0, 0],
      ["you are left to your own devices", 0, 1]
    ]
  }
  // To add another page, copy the block above (including its comma) and paste
  // another one here, right before this closing bracket, e.g.:
  // ,{
  //   lines: [
  //     ["your next poem's first line", 0, 0],
  //     ["second line", 20, 0]
  //   ]
  // }
];

/* ============================================================
   ENGINE — shouldn't need to touch below this line
============================================================ */
var poemBox = document.getElementById('poem');
var finalBox = document.getElementById('final');
var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

var sounds = {};     // one <audio> per file, created up front
PAGES.forEach(function (p) {
  if (p.audio && !sounds[p.audio]) {
    sounds[p.audio] = new Audio(p.audio);
    sounds[p.audio].preload = 'auto';
  }
});

var token = 0;       // bumps on every click so in-flight typing stops cleanly
var pageIndex = -1;  // -1 = start screen, waiting for the first tap

function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function cancelled(my) { return my !== token; }
function rand(min, max) { return min + Math.random() * (max - min); }

function makeLine(text, parent, extraClass) {
  var line = document.createElement('span');
  line.className = 'line' + (extraClass ? ' ' + extraClass : '');
  var done = document.createElement('span');
  done.className = 'done';
  var rest = document.createElement('span');
  rest.className = 'rest';
  rest.textContent = text;
  line.appendChild(done);
  line.appendChild(rest);
  parent.appendChild(line);
  return { el: line, done: done, rest: rest, text: text };
}

function buildLines(rows, box) {
  return rows.map(function (row) {
    var l = makeLine(row[0].replace(/\*/g, ''), box); // stars aren't typed
    l.raw = row[0];
    l.el.style.marginLeft = row[1] + '%';
    l.el.style.maxWidth = (100 - row[1]) + '%';
    l.el.style.marginTop = (row[2] * 1.2) + 'em';
    return l;
  });
}

async function typeLine(l, pause, my) {
  if (reduce) { l.done.textContent = l.text; l.rest.textContent = ''; return; }
  await wait(pause);
  if (cancelled(my)) return;
  l.el.classList.add('typing');
  for (var c = 1; c <= l.text.length; c++) {
    if (cancelled(my)) return;
    l.done.textContent = l.text.slice(0, c);
    l.rest.textContent = l.text.slice(c);
    await wait(CHAR_SPEED * (0.6 + Math.random() * 0.8));
  }
}

// Swap a typed line for one <span> per word, so words can bold/fade on their own.
// Text between *stars* is marked to turn bold.
function splitIntoWords(l) {
  var words = [];
  l.el.textContent = '';
  l.raw.split('*').forEach(function (part, i) {
    var marked = i % 2 === 1;
    part.split(/(\s+)/).forEach(function (bit) {
      if (!bit) return;
      if (/^\s+$/.test(bit)) { l.el.appendChild(document.createTextNode(bit)); return; }
      var w = document.createElement('span');
      w.className = 'word';
      w.textContent = bit;
      w.marked = marked;
      l.el.appendChild(w);
      words.push(w);
    });
  });
  return words;
}

var pileSeconds = PILE_MOVE_S;

function setTransition(el, driftSecs) {
  if (driftSecs) el.driftSecs = driftSecs;
  el.style.transition = 'translate ' + pileSeconds + 's ease' +
    (el.driftSecs ? ', transform ' + el.driftSecs + 's ease-in-out' : '');
}

// Slide lines 0..last up so line "last" ends above the bottom margin.
// A line never goes above the top: once it gets there it stays, so
// older lines pile up on top of each other.
function pileUp(lines, last, all) {
  var top = poemBox.getBoundingClientRect().top;
  var bottom = window.innerHeight * (1 - PILE_BOTTOM / 100) - top;
  var end = lines[last].el.offsetTop + lines[last].el.offsetHeight;
  var shift = all ? Infinity : Math.max(0, end - bottom);
  for (var i = 0; i <= last; i++) {
    var el = lines[i].el;
    setTransition(el);
    el.style.translate = '0 ' + (-Math.min(shift, el.offsetTop)) + 'px';
  }
}

async function driftLine(el, my) {
  while (!cancelled(my)) {
    var secs = rand(DRIFT_MIN_S, DRIFT_MAX_S);
    setTransition(el, secs);
    el.style.transform = 'translate(' + rand(-DRIFT_X, DRIFT_X) + 'vw,' +
                                         rand(-DRIFT_Y, DRIFT_Y) + 'vh)';
    await wait(secs * 1000);
  }
}

async function boldMarked(words, my) {
  words.filter(function (w) { return w.marked; }).forEach(function (w) {
    setTimeout(function () { if (!cancelled(my)) w.classList.add('bolded'); },
               rand(0, BOLD_SPREAD));
  });
}

async function fadeRandomWords(words, my) {
  var plain = words.filter(function (w) { return !w.marked; });
  if (!plain.length) return;
  while (true) {
    await wait(rand(FADE_EVERY_MIN, FADE_EVERY_MAX));
    if (cancelled(my)) return;
    var w = plain[Math.floor(Math.random() * plain.length)];
    if (w.fading) continue;
    w.fading = true;
    w.style.opacity = FADE_TO;
    (function (w) {
      setTimeout(function () { w.style.opacity = ''; w.fading = false; }, FADE_HOLD);
    })(w);
  }
}

function resetBoxes() {
  poemBox.classList.remove('out');
  finalBox.classList.remove('out');
  poemBox.textContent = '';
  finalBox.textContent = '';
}

async function playPage(idx, my) {
  resetBoxes();
  var page = PAGES[idx];
  var lines = buildLines(page.lines, poemBox);

  if (page.audio) {
    var s = sounds[page.audio];
    s.wanted = true;
    s.currentTime = 0;
    s.muted = false;
    s.play().catch(function () {}); // ignore if the browser blocks it
  }

  if (page.drift && !reduce) {
    lines.forEach(function (l) { driftLine(l.el, my); });
  }

  pileSeconds = PILE_MOVE_S;
  for (var i = 0; i < lines.length; i++) {
    if (page.pile) pileUp(lines, i);
    await typeLine(lines[i], LINE_PAUSE + (page.lines[i][2] ? STANZA_PAUSE : 0), my);
    if (cancelled(my)) return;
    lines[i].el.classList.remove('typing');
  }

  if (page.drift) {
    var words = [];
    lines.forEach(function (l) { words = words.concat(splitIntoWords(l)); });
    boldMarked(words, my);
    if (!reduce) fadeRandomWords(words, my);
  }

  if (page.pile && PILE_AT_END) {
    await wait(PILE_END_DELAY);
    if (cancelled(my)) return;
    pileSeconds = PILE_END_S;
    pileUp(lines, lines.length - 1, true);
  }

  if (page.finalLine) {
    await wait(FINAL_DELAY);
    if (cancelled(my)) return;
    poemBox.classList.add('out');
    await wait(FADE_MS + 400);
    if (cancelled(my)) return;
    var fl = makeLine(page.finalLine, finalBox, 'final-line');
    await typeLine(fl, 0, my); // keeps its blinking cursor at the end
  }
}

// Phones (especially iPhone) only allow sound if play() is first called
// directly inside a tap, so "unlock" every sound on the first click.
var unlocked = false;
function unlockSounds() {
  if (unlocked) return;
  unlocked = true;
  Object.keys(sounds).forEach(function (k) {
    var s = sounds[k];
    s.muted = true;
    s.play().then(function () {
      if (s.wanted) return; // the real playback already started — leave it
      s.pause(); s.currentTime = 0; s.muted = false;
    })
            .catch(function () { s.muted = false; });
  });
}

async function goToNextPage() {
  unlockSounds();
  token++;
  var my = token;

  // first tap: start the first page right away, inside the tap,
  // so the browser lets its sound play
  if (pageIndex === -1) {
    pageIndex = 0;
    playPage(pageIndex, my);
    return;
  }

  // fade out whatever is currently showing
  poemBox.classList.add('out');
  finalBox.classList.add('out');
  await wait(FADE_MS);
  if (cancelled(my)) return;

  // hold on plain black for a beat
  await wait(BLACK_PAUSE);
  if (cancelled(my)) return;

  pageIndex++;
  if (pageIndex >= PAGES.length) return; // stays on black after the last page

  playPage(pageIndex, my);
}

document.addEventListener('click', goToNextPage);

if (START_TEXT) {
  var hint = document.createElement('span');
  hint.className = 'start-hint';
  hint.textContent = START_TEXT;
  finalBox.appendChild(hint);
}
</script>
</body>
</html>
