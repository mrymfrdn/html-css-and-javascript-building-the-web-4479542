<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dino Climb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #202124;
      --panel: #2a2b2f;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --border: #3c4043;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    main {
      max-width: 940px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    h1 {
      font-family: "Press Start 2P", monospace;
      font-size: clamp(18px, 4vw, 28px);
      letter-spacing: 2px;
      margin: 0 0 8px;
    }

    .sub { color: var(--muted); margin: 0 0 24px; }

    .game-wrap {
      position: relative;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 900 / 400;
      touch-action: manipulation;
      cursor: pointer;
    }

    .controls { color: var(--muted); font-size: 14px; margin: 10px 0 32px; }

    kbd {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 12px;
    }

    .messages {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .messages h2 { margin: 0 0 4px; font-size: 18px; }
    .messages p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

    textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font: inherit;
    }

    textarea:focus, button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 14px;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover { border-color: var(--accent); }

    #status { min-height: 1.5em; margin: 10px 0 0; color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>DINO CLIMB</h1>
    <p class="sub">The internet is down, so the dino went hiking. Help it climb the mountain.</p>

    <div class="game-wrap">
      <canvas id="game" width="900" height="400"
        aria-label="Dino Climb game. A pixel dinosaur runs up a mountain, jumping over rocks and rolling boulders."></canvas>
    </div>
    <p class="controls">
      <kbd>Space</kbd> / <kbd>↑</kbd> / tap to jump — hold for a higher jump. Your score is how high you climb.
    </p>

    <section class="messages">
      <h2>Your messages</h2>
      <p>Each line becomes a sign on the mountain. When the dino passes a sign, the message pops up on screen.</p>
      <textarea id="msgInput" aria-label="Messages, one per line" placeholder="Happy birthday!&#10;Almost at the top...&#10;You can do it!"></textarea>
      <div class="row">
        <button id="showBtn" type="button">Show first message now</button>
        <button id="shareBtn" type="button">Copy link with these messages</button>
        <button id="clearBtn" type="button">Clear</button>
      </div>
      <p id="status" role="status"></p>
    </section>
  </main>

  <script>
  (() => {
    // ---------- Canvas setup ----------
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const W = 900, H = 400;
    const GROUND_LINE = H - 45;      // screen y where the dino's ground sits
    const DINO_SCREEN_X = 110;       // dino stays at this screen x
    const PX = 3;                    // size of one sprite pixel
    const FONT = '"Press Start 2P", monospace';

    function setupCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
    }
    setupCanvas();
    window.addEventListener('resize', setupCanvas);

    // ---------- Safe storage helpers ----------
    const store = {
      get(key) { try { return localStorage.getItem(key); } catch { return null; } },
      set(key, val) { try { localStorage.setItem(key, val); } catch { /* ignore */ } }
    };

    // ---------- Terrain ----------
    // The mountain is a height map sampled every STEP world pixels.
    // Flat start, then a slope that gets steeper the further you go.
    const STEP = 8;
    const terrain = [0];

    function slopeAt(x) {
      if (x < 600) return 0;
      const warm = Math.min(1, (x - 600) / 1200);
      const ramp = Math.min(0.24, warm * 0.12 + Math.max(0, x - 1800) / 30000);
      const bumps = warm * (0.07 * Math.sin(x / 310) + 0.03 * Math.sin(x / 113 + 1.3));
      return Math.max(-0.04, ramp + bumps);
    }

    function altAt(x) {
      if (x <= 0) return 0;
      const f = x / STEP;
      const i = Math.floor(f);
      while (terrain.length <= i + 1) {
        const k = terrain.length;
        terrain.push(terrain[k - 1] + slopeAt(k * STEP) * STEP);
      }
      return terrain[i] + (terrain[i + 1] - terrain[i]) * (f - i);
    }

    function slopeUnder(x) { return (altAt(x + 6) - altAt(x - 6)) / 12; }

    // ---------- Dino sprites (original pixel art) ----------
    const PALETTE = {
      g: '#5bbf6a', d: '#2f7a3d', y: '#d8e8a0',
      w: '#ffffff', k: '#111111', r: '#e2493b', s: '#b8362b'
    };
    const HEAD_BODY = [
      '..........rrrrrr..',
      '.........rrrrrrrr.',
      '.........sssssssss',
      '.........ggwkggggg',
      '.........ggggggggg',
      '.........gggggdddd',
      '.........ggggg....',
      '........ggggggg...',
      'g.....ggggggggdd..',
      'g....gggyyyygg.d..',
      'gg..ggggyyyygg....',
      'ggggggggyyyygg....',
      '.gggggggyyyyg.....',
      '..ggggggggggg.....'
    ];
    const LEGS = {
      run1: ['....gg....gg......', '....gg.....gg.....', '....ggg....ggg....'],
      run2: ['....gg....gg......', '.....gg..gg.......', '....ggg..ggg......'],
      jump: ['....gg....gg......', '....ggg...ggg.....', '..................'],
      stand: ['....gg....gg......', '....gg....gg......', '....ggg...ggg.....']
    };

    function makeSprite(rows) {
      const c = document.createElement('canvas');
      c.width = 18 * PX;
      c.height = rows.length * PX;
      const g = c.getContext('2d');
      rows.forEach((row, y) => {
        [...row.padEnd(18, '.')].forEach((ch, x) => {
          if (ch === '.') return;
          g.fillStyle = PALETTE[ch];
          g.fillRect(x * PX, y * PX, PX, PX);
        });
      });
      return c;
    }

    const deadHead = HEAD_BODY.map((r, i) => i === 3 ? r.replace('wk', 'kw') : i === 5 ? r.replace('dddd', 'dkkd') : r);
    const SPRITES = {
      run1: makeSprite([...HEAD_BODY, ...LEGS.run1]),
      run2: makeSprite([...HEAD_BODY, ...LEGS.run2]),
      jump: makeSprite([...HEAD_BODY, ...LEGS.jump]),
      stand: makeSprite([...HEAD_BODY, ...LEGS.stand]),
      dead: makeSprite([...deadHead, ...LEGS.stand])
    };
    const DINO_W = 18 * PX, DINO_H = 17 * PX;

    // ---------- Messages ----------
    const msgInput = document.getElementById('msgInput');
    const statusEl = document.getElementById('status');
    let messages = [];

    function parseMessages(text) {
      return text.split('\n').map(s => s.trim()).filter(Boolean);
    }

    function loadMessages() {
      const fromUrl = new URLSearchParams(location.search).get('m');
      const saved = fromUrl !== null ? fromUrl : store.get('dinoClimbMessages');
      msgInput.value = saved || '';
      messages = parseMessages(msgInput.value);
    }

    msgInput.addEventListener('input', () => {
      messages = parseMessages(msgInput.value);
      store.set('dinoClimbMessages', msgInput.value);
    });

    document.getElementById('showBtn').addEventListener('click', () => {
      if (!messages.length) { setStatus('Type a message first.'); return; }
      showBanner(messages[0]);
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      msgInput.value = '';
      messages = [];
      store.set('dinoClimbMessages', '');
      setStatus('Messages cleared.');
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      const url = location.origin + location.pathname + '?m=' + encodeURIComponent(msgInput.value.trim());
      try {
        await navigator.clipboard.writeText(url);
        setStatus('Link copied! Anyone who opens it sees your messages.');
      } catch {
        setStatus(url);
      }
    });

    let statusTimer;
    function setStatus(text) {
      statusEl.textContent = text;
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 4000);
    }

    // Signs are placed every SIGN_GAP world pixels; sign k shows messages[k % n].
    const SIGN_START = 900, SIGN_GAP = 1500;
    let banner = null; // { text, t }

    function showBanner(text) { banner = { text, t: 0 }; }

    // ---------- Game state ----------
    const GRAVITY = 2600, JUMP_V = 860, JUMP_CUT = 320;
    const SPEED_START = 320, SPEED_MAX = 680, SPEED_ACCEL = 9;

    let state = 'ready';
    let dino, obstacles, nextSpawnX, speed, camAlt, lastSign, time, deathShake;
    let best = Number(store.get('dinoClimbBest')) || 0;

    function reset() {
      dino = { x: 0, alt: 0, vy: 0, onGround: true, anim: 0 };
      obstacles = [];
      nextSpawnX = 800;
      speed = SPEED_START;
      camAlt = 0;
      lastSign = -1;
      time = 0;
      deathShake = 0;
    }
    reset();

    const footX = () => dino.x + DINO_W / 2;
    const camX = () => dino.x - DINO_SCREEN_X;
    const altToY = a => GROUND_LINE - (a - camAlt);
    const meters = () => Math.floor(altAt(footX()) / 10);

    // ---------- Input ----------
    let jumpHeld = false;

    function press() {
      if (state === 'ready') { state = 'running'; }
      else if (state === 'over') {
        if (deathShake > 0.2) return; // tiny delay so you don't restart by accident
        reset(); state = 'running'; return;
      }
      jumpHeld = true;
      if (dino.onGround) { dino.vy = JUMP_V; dino.onGround = false; }
    }

    function release() {
      jumpHeld = false;
      if (!dino.onGround && dino.vy > JUMP_CUT) dino.vy = JUMP_CUT;
    }

    function isTyping(e) {
      const t = e.target;
      return t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT' || t.tagName === 'BUTTON');
    }

    window.addEventListener('keydown', e => {
      if (isTyping(e)) return;
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
        e.preventDefault();
        if (!e.repeat) press();
      }
    });
    window.addEventListener('keyup', e => {
      if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release();
    });
    canvas.addEventListener('pointerdown', e => { e.preventDefault(); press(); });
    window.addEventListener('pointerup', release);

    // ---------- Spawning ----------
    function spawnObstacles() {
      while (nextSpawnX < dino.x + W + 200) {
        const m = altAt(nextSpawnX) / 10;
        const boulderChance = m < 15 ? 0 : Math.min(0.45, 0.2 + m / 2000);
        const x = nextSpawnX;

        if (Math.random() < boulderChance) {
          const r = 13 + Math.random() * 7;
          obstacles.push({ type: 'boulder', x, r, rot: 0, v: 140 + Math.random() * 60 });
          nextSpawnX += 260; // boulders roll toward you, so leave extra room
        } else {
          const count = Math.random() < 0.25 ? 2 : 1;
          let ox = x;
          for (let i = 0; i < count; i++) {
            const w = 18 + Math.random() * 14;
            obstacles.push({ type: 'rock', x: ox, w, h: 20 + Math.random() * 16, seed: Math.random() });
            ox += w - 4;
          }
        }
        nextSpawnX += speed * 0.75 + 140 + Math.random() * speed * 0.9;
      }
      obstacles = obstacles.filter(o => o.x > camX() - 100);
    }

    // ---------- Update ----------
    function update(dt) {
      time += dt;
      if (banner) { banner.t += dt; if (banner.t > 3.2) banner = null; }

      if (state === 'over') { deathShake = Math.max(0, deathShake - dt); return; }
      if (state !== 'running') { dino.anim += dt; return; }

      speed = Math.min(SPEED_MAX, speed + SPEED_ACCEL * dt);
      dino.x += speed * dt;
      dino.anim += dt * speed / 320;

      const ground = altAt(footX());
      if (dino.onGround) {
        dino.alt = ground;
      } else {
        dino.vy -= GRAVITY * dt;
        dino.alt += dino.vy * dt;
        if (dino.alt <= ground) { dino.alt = ground; dino.vy = 0; dino.onGround = true; }
      }

      // Camera follows the ground (not the jump) so the view doesn't bounce.
      camAlt += (ground - camAlt) * Math.min(1, dt * 6);

      for (const o of obstacles) {
        if (o.type === 'boulder') {
          o.x -= o.v * dt;
          o.rot -= (o.v * dt) / o.r;
        }
      }
      spawnObstacles();

      // Signs with messages
      if (messages.length) {
        const k = Math.floor((footX() - SIGN_START) / SIGN_GAP);
        if (k > lastSign && k >= 0) {
          lastSign = k;
          showBanner(messages[k % messages.length]);
        }
      }

      if (hitSomething()) {
        state = 'over';
        deathShake = 0.5;
        const m = meters();
        if (m > best) { best = m; store.set('dinoClimbBest', String(best)); }
      }
    }

    function dinoBox() {
      const bottom = altToY(dino.alt);
      return { l: DINO_SCREEN_X + 14, r: DINO_SCREEN_X + DINO_W - 10, t: bottom - DINO_H + 8, b: bottom - 4 };
    }

    function hitSomething() {
      const d = dinoBox();
      const cx = camX();
      for (const o of obstacles) {
        if (o.type === 'rock') {
          const l = o.x - cx + 3, r = o.x + o.w - cx - 3;
          const b = altToY(Math.min(altAt(o.x), altAt(o.x + o.w)));
          const t = altToY(altAt(o.x + o.w / 2)) - o.h + 4;
          if (d.l < r && d.r > l && d.t < b && d.b > t) return true;
        } else {
          const bx = o.x - cx, by = altToY(altAt(o.x) + o.r);
          const nx = Math.max(d.l, Math.min(bx, d.r));
          const ny = Math.max(d.t, Math.min(by, d.b));
          const rr = o.r - 3;
          if ((bx - nx) ** 2 + (by - ny) ** 2 < rr * rr) return true;
        }
      }
      return false;
    }

    // ---------- Drawing ----------
    const lerp = (a, b, t) => a + (b - a) * t;
    function mix(c1, c2, t) {
      const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
      const r = Math.round(lerp(a >> 16, b >> 16, t));
      const g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t));
      const bl = Math.round(lerp(a & 255, b & 255, t));
      return `rgb(${r},${g},${bl})`;
    }

    function drawSky(t) {
      const grad = ctx.createLinearGradient(0, 0, 0, H);
      grad.addColorStop(0, mix('#6fbfee', '#14143a', t));
      grad.addColorStop(1, mix('#dff3ff', '#5d4f8f', t));
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      // Stars fade in high up
      if (t > 0.45) {
        ctx.globalAlpha = Math.min(1, (t - 0.45) * 3);
        ctx.fillStyle = '#fff';
        for (let i = 0; i < 60; i++) {
          const sx = ((i * 137.5 - camX() * 0.02) % W + W) % W;
          const sy = (i * 71.3) % (H * 0.6);
          const s = i % 7 === 0 ? 2 : 1;
          ctx.fillRect(sx, sy, s, s);
        }
        ctx.globalAlpha = 1;
      }

      // Sun that turns into a moon
      ctx.fillStyle = mix('#fff6c2', '#e8e8f8', t);
      ctx.beginPath();
      ctx.arc(W - 120, 70, 26, 0, Math.PI * 2);
      ctx.fill();
      if (t > 0.45) {
        ctx.fillStyle = mix('#6fbfee', '#14143a', t);
        ctx.beginPath();
        ctx.arc(W - 108, 62, 24, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawRange(parallax, base, sink, amp, color, snow) {
      const off = camX() * parallax;
      const baseY = base + Math.min(camAlt * parallax * 0.6, sink);
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, H);
      const pts = [];
      for (let sx = 0; sx <= W; sx += 6) {
        const x = sx + off;
        const y = baseY - amp * (0.55 + 0.3 * Math.sin(x / 140) + 0.15 * Math.sin(x / 53 + 2) + 0.2 * Math.abs(Math.sin(x / 260)));
        pts.push([sx, y]);
        ctx.lineTo(sx, y);
      }
      ctx.lineTo(W, H);
      ctx.fill();

      if (snow) {
        // snowcaps: lighten the tops of the peaks
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        const capLine = baseY - amp * 0.9;
        ctx.beginPath();
        let open = false;
        for (const [sx, y] of pts) {
          if (y < capLine) {
            if (!open) { ctx.moveTo(sx, capLine); open = true; }
            ctx.lineTo(sx, y);
          } else if (open) {
            ctx.lineTo(sx, capLine); ctx.closePath(); open = false;
          }
        }
        if (open) { ctx.lineTo(W, capLine); ctx.closePath(); }
        ctx.fill();
      }
    }

    function drawClouds(t) {
      ctx.fillStyle = `rgba(255,255,255,${lerp(0.85, 0.25, t)})`;
      for (let i = 0; i < 5; i++) {
        const span = W + 200;
        const x = ((i * 260 - camX() * 0.15 - time * 8) % span + span) % span - 100;
        const y = 50 + (i * 47) % 90 + Math.min(camAlt * 0.1, 200) * (i % 2 ? 1 : 0.6);
        ctx.fillRect(x, y, 70, 10);
        ctx.fillRect(x + 12, y - 8, 40, 8);
        ctx.fillRect(x + 24, y - 14, 18, 6);
      }
    }

    function surfaceColor(a) {
      if (a < 700) return '#5aa04a';      // grass
      if (a < 2200) return '#8f8172';     // rock
      return '#f2f6fa';                   // snow
    }

    function drawGround() {
      const cx = camX();
      ctx.fillStyle = '#4b3d33';
      ctx.beginPath();
      ctx.moveTo(-10, H);
      for (let sx = -10; sx <= W + 10; sx += 6) ctx.lineTo(sx, altToY(altAt(sx + cx)));
      ctx.lineTo(W + 10, H);
      ctx.fill();

      // Little speckles of rock in the dirt (fixed to the world so they scroll)
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      const startX = Math.floor(cx / 23) * 23;
      for (let x = startX; x < cx + W + 23; x += 23) {
        const n = Math.sin(x * 12.9898) * 43758.5453;
        const r = n - Math.floor(n);
        const sx = x - cx;
        const y = altToY(altAt(x)) + 12 + r * 30;
        ctx.fillRect(sx, y, 3 + r * 4, 2);
      }

      // Surface strip, coloured by altitude
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      for (let sx = -10; sx <= W + 10; sx += 6) {
        const a = altAt(sx + cx);
        ctx.strokeStyle = surfaceColor(a);
        ctx.beginPath();
        ctx.moveTo(sx, altToY(a) + 2);
        ctx.lineTo(sx + 6, altToY(altAt(sx + 6 + cx)) + 2);
        ctx.stroke();
      }
    }

    function drawSigns() {
      if (!messages.length) return;
      const cx = camX();
      const first = Math.max(0, Math.floor((cx - SIGN_START) / SIGN_GAP));
      for (let k = first; k <= first + 2; k++) {
        const x = SIGN_START + k * SIGN_GAP;
        const sx = x - cx;
        if (sx < -80 || sx > W + 80) continue;
        const gy = altToY(altAt(x));
        ctx.fillStyle = '#6b4a2b';
        ctx.fillRect(sx - 2, gy - 46, 5, 46);
        ctx.fillStyle = '#c8955a';
        ctx.fillRect(sx - 44, gy - 70, 90, 28);
        ctx.strokeStyle = '#6b4a2b';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx - 44, gy - 70, 90, 28);
        ctx.fillStyle = '#3a2614';
        ctx.font = `7px ${FONT}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        let text = messages[k % messages.length];
        while (text.length > 1 && ctx.measureText(text).width > 82) text = text.slice(0, -2) + '…';
        ctx.fillText(text, sx + 1, gy - 56);
      }
    }

    function drawRock(o, cx) {
      const l = o.x - cx;
      const gy = altToY(altAt(o.x + o.w / 2)) + 4;
      ctx.fillStyle = '#7d7f86';
      ctx.beginPath();
      ctx.moveTo(l, altToY(altAt(o.x)) + 4);
      ctx.lineTo(l + o.w * 0.15, gy - o.h * 0.7);
      ctx.lineTo(l + o.w * (0.35 + o.seed * 0.2), gy - o.h);
      ctx.lineTo(l + o.w * 0.85, gy - o.h * 0.75);
      ctx.lineTo(l + o.w, altToY(altAt(o.x + o.w)) + 4);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#a3a5ac';
      ctx.beginPath();
      ctx.moveTo(l + o.w * 0.15, gy - o.h * 0.7);
      ctx.lineTo(l + o.w * (0.35 + o.seed * 0.2), gy - o.h);
      ctx.lineTo(l + o.w * 0.45, gy - o.h * 0.45);
      ctx.closePath();
      ctx.fill();
    }

    function drawBoulder(o, cx) {
      const bx = o.x - cx, by = altToY(altAt(o.x) + o.r);
      ctx.save();
      ctx.translate(bx, by);
      ctx.rotate(o.rot);
      ctx.fillStyle = '#6a5c52';
      ctx.beginPath();
      ctx.arc(0, 0, o.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#463b34';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-o.r * 0.6, -o.r * 0.2); ctx.lineTo(o.r * 0.1, o.r * 0.3);
      ctx.moveTo(o.r * 0.2, -o.r * 0.6); ctx.lineTo(o.r * 0.5, 0);
      ctx.stroke();
      ctx.restore();
      // dust puff behind it
      ctx.fillStyle = 'rgba(200,190,170,0.5)';
      ctx.fillRect(bx + o.r + 2, by + o.r - 6, 6, 4);
      ctx.fillRect(bx + o.r + 10, by + o.r - 10, 4, 3);
    }

    function drawDino() {
      let sprite;
      if (state === 'over') sprite = SPRITES.dead;
      else if (state === 'ready') sprite = SPRITES.stand;
      else if (!dino.onGround) sprite = SPRITES.jump;
      else sprite = Math.floor(dino.anim * 8) % 2 ? SPRITES.run1 : SPRITES.run2;

      const bottom = altToY(dino.alt);
      const tilt = dino.onGround ? -Math.atan(slopeUnder(footX())) * 0.7 : -0.1;
      ctx.save();
      ctx.translate(DINO_SCREEN_X + DINO_W / 2, bottom);
      ctx.rotate(tilt);
      ctx.drawImage(sprite, -DINO_W / 2, -DINO_H);
      ctx.restore();
    }

    function drawHUD() {
      ctx.font = `14px ${FONT}`;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      const txt = `HI ${String(best).padStart(4, '0')}m  ${String(meters()).padStart(4, '0')}m`;
      ctx.fillText(txt, W - 18, 20);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(txt, W - 20, 18);
    }

    function wrap(text, maxW) {
      const words = text.split(/\s+/);
      const lines = [];
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; }
        else line = test;
      }
      if (line) lines.push(line);
      return lines.slice(0, 4);
    }

    function drawBanner() {
      if (!banner) return;
      const fade = Math.min(1, banner.t * 5, (3.2 - banner.t) * 3);
      ctx.globalAlpha = Math.max(0, fade);
      ctx.font = `16px ${FONT}`;
      const lines = wrap(banner.text, W - 160);
      const lh = 26;
      const boxH = lines.length * lh + 28;
      const y = 58 - (1 - Math.min(1, banner.t * 5)) * 12;
      ctx.fillStyle = 'rgba(20,20,30,0.78)';
      ctx.fillRect(60, y, W - 120, boxH);
      ctx.fillStyle = '#ffd866';
      ctx.fillRect(60, y, W - 120, 4);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      lines.forEach((l, i) => ctx.fillText(l, W / 2, y + 18 + i * lh));
      ctx.globalAlpha = 1;
    }

    function centerText(lines) {
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      lines.forEach(([text, size, y]) => {
        ctx.font = `${size}px ${FONT}`;
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillText(text, W / 2 + 2, y + 2);
        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, W / 2, y);
      });
    }

    function draw() {
      const t = Math.min(1, camAlt / 5000);
      ctx.save();
      if (deathShake > 0) ctx.translate((Math.random() - 0.5) * deathShake * 12, (Math.random() - 0.5) * deathShake * 12);

      drawSky(t);
      drawClouds(t);
      drawRange(0.08, H * 0.62, 140, 150, mix('#a9bdd0', '#4a4f7c', t), true);
      drawRange(0.2, H * 0.78, 260, 110, mix('#7f97a8', '#33395e', t), false);
      drawGround();
      drawSigns();
      const cx = camX();
      for (const o of obstacles) o.type === 'rock' ? drawRock(o, cx) : drawBoulder(o, cx);
      drawDino();
      ctx.restore();

      drawHUD();
      drawBanner();

      if (state === 'ready') {
        centerText([['DINO CLIMB', 26, 150], ['Press SPACE or tap to start', 11, 195]]);
      } else if (state === 'over') {
        centerText([['YOU TUMBLED!', 24, 150], [`You climbed ${meters()} m`, 12, 192], ['Space or tap to try again', 10, 222]]);
      }
    }

    // ---------- Main loop ----------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    loadMessages();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
